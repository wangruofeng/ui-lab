<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="从设计书籍与参考项目中学习，用可操作的前后对照练习界面设计。"
    />
    <title>设计案例库</title>
    <link rel="icon" type="image/png" sizes="96x96" href="./brand-mark.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="kill-slop.css" />
    <link rel="stylesheet" href="design-hackers.css" />
    <link rel="stylesheet" href="motion-primitives.css" />
    <link rel="stylesheet" href="motion-primitives-examples.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#case">跳到内容</a>
    <header class="site-header">
      <div class="header-content">
        <a href="#/" class="brand">
          <img
            class="brand-mark"
            src="./brand-mark.png"
            width="22"
            height="22"
            alt=""
          />
          <span>UI Lab</span>
        </a>
        <nav class="site-navigation" aria-label="主导航">
          <details class="source-menu" hidden>
            <summary>切换来源</summary>
            <ul class="source-options" aria-label="切换来源"></ul>
          </details>
          <button
            class="catalog-jump nav-control"
            type="button"
            aria-haspopup="dialog"
            aria-controls="catalog-dialog"
            hidden
          >
            目录
          </button>
          <button
            class="open-search nav-control"
            type="button"
            aria-haspopup="dialog"
            aria-controls="search-dialog"
            aria-keyshortcuts="Control+K Meta+K"
            aria-label="搜索案例"
            title="搜索案例"
          >
            <span class="search-icon" aria-hidden="true"></span>
          </button>
          <a
            class="github-link nav-control"
            href="https://github.com/wangruofeng/ui-lab"
            aria-label="查看 GitHub 仓库"
            title="查看 GitHub 仓库"
          >
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
            </svg>
          </a>
        </nav>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar" aria-label="当前来源目录" hidden>
        <label class="search-label" for="search">案例目录</label>
        <input
          id="search"
          type="search"
          placeholder="搜索标题、概念…"
          autocomplete="off"
        />
        <nav id="catalog" aria-label="按章节浏览"></nav>
      </aside>
      <main id="case" tabindex="-1" aria-labelledby="case-title"></main>
    </div>
    <dialog
      id="search-dialog"
      class="nav-dialog"
      aria-labelledby="search-dialog-title"
    >
      <div class="nav-dialog-inner">
        <header class="nav-dialog-header">
          <h2 id="search-dialog-title">搜索案例</h2>
          <form method="dialog">
            <button class="dialog-close" aria-label="关闭搜索">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                <path d="m3 3 8 8m0-8-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </button>
          </form>
        </header>
        <input
          id="global-search"
          type="search"
          aria-label="搜索所有案例"
          placeholder="搜索所有来源的案例…"
          autocomplete="off"
          autofocus
        />
        <p id="search-status" role="status"></p>
        <ul id="search-results" aria-label="搜索结果"></ul>
      </div>
    </dialog>
    <dialog
      id="catalog-dialog"
      class="nav-dialog catalog-dialog"
      aria-labelledby="catalog-dialog-title"
    >
      <div class="nav-dialog-inner">
        <header class="nav-dialog-header">
          <h2 id="catalog-dialog-title">案例目录</h2>
          <form method="dialog">
            <button class="dialog-close" aria-label="关闭目录" autofocus>
              关闭
            </button>
          </form>
        </header>
        <div class="catalog-content"></div>
      </div>
    </dialog>
    <dialog id="artwork-dialog" class="artwork-dialog" aria-label="图片预览">
      <form method="dialog">
        <button class="artwork-close" aria-label="关闭预览" autofocus>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </form>
      <img alt="">
    </dialog>
  </body>
</html>
